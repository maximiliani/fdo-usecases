<html lang="en">

    <title>FDO Graph Visualization</title>

    <!-- Load pid-component web component -->

    <script type="module">
        import { defineCustomElements } from 'https://cdn.jsdelivr.net/npm/@kit-data-manager/pid-component/dist/loader/index.js';
        defineCustomElements();

    <style>

        }

        }

        #graph-container {

            position: relative;
        }

        #cy {
            width: 100%;

        }

        #details-panel {

<body>
    <div id="loading-overlay">

        <div id="graph-container">
            <div id="cy"></div>
            <div id="details-panel">
                <div class="panel-header">
                    <h3>FDO Details</h3>
                    <button class="close-btn" id="close-details">&times;</button>
                </div>
                <div class="panel-content" id="details-content">
                    <p style="color: #95a5a6; text-align: center; margin-top: 50px;">
                        Click on a node to view details
                    </p>
                </div>

    <script>
        // Raw JSON injected from Python
        let RAW_GRAPH_DATA = $raw_json;

        /**
         * Normalize the embedded graph into the canonical shape
         * `{pid: {record: [{key, value}]}}` used throughout this viewer.
         *
         * Supported input formats:
         *   1. Canonical (output of `toSimpleJSON`, e.g. fdo_graph_merged.json):
         *      `{pid: {record: [{key, value}, ...]}}` - used as-is.
         *   2. Flat ES-document list (output of `build_es_documents`,
         *      e.g. fdo_graph_es_ingest.json): `[{pid, "<infoTypePID>": [values]|value, ...}]`
         *      - each entry is expanded into `{pid: {record: [{key, value}, ...]}}`,
         *      flattening list values into one attribute per element.
         *
         * Any other format is returned unchanged.
         */
        function normalizeGraphData(raw) {
            if (raw && typeof raw === 'object' && !Array.isArray(raw)) {
                const first = Object.values(raw)[0];
                if (first && typeof first === 'object' && 'record' in first) {
                    return raw;
                }
            }

            if (Array.isArray(raw)) {
                const normalized = {};
                let converted = false;

                raw.forEach(entry => {
                    if (!entry || typeof entry !== 'object' || !entry.pid) {
                        return;
                    }
                    const record = [];
                    Object.entries(entry).forEach(([key, value]) => {
                        if (key === 'pid') {
                            return;
                        }
                        converted = true;
                        const values = Array.isArray(value) ? value : [value];
                        values.forEach(v => {
                            record.push({ key: key, value: v });
                        });
                    });
                    normalized[entry.pid] = { record: record };
                });

                if (converted) {
                    return normalized;
                }
            }

            return raw;
        }
        const DEFAULT_LAYOUT = '$layout_algorithm';

        let cy;
        let currentDisplayMode = 'name';
        let focusedNodeId = null;
        let focusedNodeSet = new Set();
        let focusedEdgeSet = new Set();
        let originalFocusedNodeSet = new Set();
        let originalFocusedEdgeSet = new Set();
        let visibleRelationships = new Set();
        let profileGroupVisibility = new Map();
        let profileGroupCustomizations = new Map();
        let searchMode = false;
        let preSearchState = null;
        let searchIndex = {
            nodeIndex: new Map(),
            invertedIndex: new Map(),
        };

        const CONFIG = {
            SEARCH: {
                MIN_TOKEN_LENGTH: 2,
                DEBOUNCE_MS: 300,
                HIGHLIGHT_PADDING: 50,
                ANIMATION_DURATION: 500,
                EXACT_MATCH_BOOST: 10
            },
            FOCUS: {
                EXPANSION_HIGHLIGHT_DURATION: 2000,
                FIT_PADDING: 50
            },
            STYLES: {
                HIGHLIGHT_COLOR: '#f39c12',
                HIGHLIGHT_BORDER: '#e74c3c',
                HIGHLIGHT_SCALE: 1.2,
                HIGHLIGHT_BORDER_WIDTH: 4
            }
        };

        // Cache for resolved attribute metadata
        const attrMetaCache = new Map();

        // Loading steps configuration
        const LOADING_STEPS = [
            { text: 'Parsing raw JSON...', weight: 5 },
            { text: 'Analyzing profile distribution...', weight: 10 },
            { text: 'Building node structures...', weight: 10 },
            { text: 'Collecting all attribute keys...', weight: 10 },
            { text: 'Resolving attribute metadata...', weight: 50 },
            { text: 'Initializing visualization...', weight: 15 }
        ];

        function updateLoading(stepIndex, progressInStep) {
            const step = LOADING_STEPS[stepIndex];
            const baseProgress = LOADING_STEPS.slice(0, stepIndex)
                .reduce((sum, s) => sum + s.weight, 0);

            const totalProgress = baseProgress + (progressInStep * step.weight / 100);

            document.getElementById('progress-bar').style.width = `${totalProgress}%`;
            document.getElementById('progress-percentage').textContent =
                `${Math.round(totalProgress)}% - ${step.text}`;
        }

        function hideLoadingOverlay() {
            setTimeout(() => {
                document.getElementById('loading-overlay').classList.add('hidden');
            }, 500);
        }


        function truncatePid(pid, maxLength = 30) {
            if (!pid) return '';
            if (pid.length <= maxLength) return pid;
            return `${pid.substring(0, Math.floor(maxLength / 2))}...${pid.substring(pid.length - Math.ceil(maxLength / 2))}`;
        }

        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toast-container');
            const colors = {
                success: '#27ae60',
                error: '#e74c3c',
                warning: '#f39c12',
                info: '#3498db'
            };

            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.style.cssText = `
                background: ${colors[type] || colors.info};
                animation: slideIn 0.3s ease-out;
            `;
            toast.textContent = message;

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s ease-in';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        /**
         * Convert text to searchable tokens.
         * Splits on whitespace/separators, generates sub-tokens from compound words.
         * @param {string} text - Text to tokenize
         * @returns {string[]} Lowercase tokens (min 2 chars)
         */
        function tokenize(text) {
            if (!text) return [];

            const tokens = text.toLowerCase()
                .split(/[\s.:\/]+/)
                .map(t => t.trim())
                .filter(t => t.length >= 2);

            const subTokens = [];
            tokens.forEach(token => {
                if (token.includes('-')) {
                    const parts = token.split('-').filter(p => p.length >= 2);
                    subTokens.push(...parts);
                }
                if (token.includes('_')) {
                    const parts = token.split('_').filter(p => p.length >= 2);
                    subTokens.push(...parts);
                }
            });

            return [...new Set([...tokens, ...subTokens])];
        }

        function hexToHsl(hex) {
            hex = hex.replace(/^#/, '');
            const r = parseInt(hex.substring(0, 2), 16) / 255;
            const g = parseInt(hex.substring(2, 4), 16) / 255;
            const b = parseInt(hex.substring(4, 6), 16) / 255;

            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;

            if (max === min) {
                h = s = 0;
            } else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                    case g: h = ((b - r) / d + 2) / 6; break;
                    case b: h = ((r - g) / d + 4) / 6; break;
                }
            }

            return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
        }

        function hslToHex(h, s, l) {
            s /= 100;
            l /= 100;
            const k = n => (n + h / 30) % 12;
            const a = s * Math.min(l, 1 - l);
            const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
            return '#' + [f(0), f(8), f(4)].map(x => {
                const hex = Math.round(x * 255).toString(16);
                return hex.length === 1 ? '0' + hex : hex;
            }).join('');
        }

        function calculateProfileFrequencies() {
            const frequencyMap = new Map();
            const totalNodes = Object.keys(RAW_GRAPH_DATA).length;

            Object.values(RAW_GRAPH_DATA).forEach(recordData => {
                const profiles = extractProfilePids(recordData.record || []);
                profiles.forEach(p => {
                    frequencyMap.set(p, (frequencyMap.get(p) || 0) + 1);
                });
            });

            const frequencies = Array.from(frequencyMap.values());
            const mean = frequencies.reduce((a, b) => a + b, 0) / frequencies.length;
            const sorted = [...frequencies].sort((a, b) => a - b);
            const median = sorted[Math.floor(sorted.length / 2)];
            const stddev = Math.sqrt(
                frequencies.reduce((sum, f) => sum + Math.pow(f - mean, 2), 0) / frequencies.length
            );

            return { frequencyMap, totalNodes, mean, median, stddev };
        }

        function getProfileWeight(frequency, stats) {
            const { mean, stddev } = stats;
            const zScore = (frequency - mean) / (stddev || 1);

            if (zScore > 1.5) return 0.1;
            if (zScore > 0.5) return 0.3;
            if (zScore > -0.5) return 0.6;
            if (zScore > -1.5) return 0.9;
            return 1.0;
        }

        function getProfileHSL(profilePid) {
            for (const [groupId, groupData] of profileGroupVisibility) {
                if (groupData.profiles.has(profilePid) && groupData.customColor) {
                    return hexToHsl(groupData.customColor);
                }
            }

            let hash = 0;
            for (let i = 0; i < profilePid.length; i++) {
                hash = profilePid.charCodeAt(i) + ((hash << 5) - hash);
            }
            const hue = Math.abs(hash % 360);
            return { h: hue, s: 70, l: 50 };
        }

        function hslToRgb(h, s, l) {
            s /= 100;
            l /= 100;
            const k = n => (n + h / 30) % 12;
            const a = s * Math.min(l, 1 - l);
            const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
            return { r: Math.round(f(0) * 255), g: Math.round(f(8) * 255), b: Math.round(f(4) * 255) };
        }

        function rgbToHsl(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;
            if (max === min) {
                h = s = 0;
            } else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                    case g: h = ((b - r) / d + 2) / 6; break;
                    case b: h = ((r - g) / d + 4) / 6; break;
                }
            }
            return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
        }

        function blendColorsWeighted(profiles, stats) {
            if (profiles.length === 0) return '#95a5a6';
            if (profiles.length === 1) {
                const hsl = getProfileHSL(profiles[0]);
                return `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;
            }

            const weightedProfiles = profiles.map(pid => ({
                pid,
                color: getProfileHSL(pid),
                weight: getProfileWeight(stats.frequencyMap.get(pid), stats)
            }));

            const mostSpecific = weightedProfiles.reduce((max, p) =>
                p.weight > max.weight ? p : max, weightedProfiles[0]
            );

            const dominantWeight = 0.8;
            const otherWeight = 0.2 / (weightedProfiles.length - 1);

            let totalR = 0, totalG = 0, totalB = 0;

            weightedProfiles.forEach(p => {
                const rgb = hslToRgb(p.color.h, p.color.s, p.color.l);
                const w = p.pid === mostSpecific.pid ? dominantWeight : otherWeight;
                totalR += rgb.r * w;
                totalG += rgb.g * w;
                totalB += rgb.b * w;
            });

            const blended = rgbToHsl(
                Math.round(totalR),
                Math.round(totalG),
                Math.round(totalB)
            );

            return `hsl(${blended.h}, ${blended.s}%, ${blended.l}%)`;
        }

        function extractProfilePids(recordArray) {
            const PROFILE_KEY = '21.T11148/076759916209e5d62bd5';
            return recordArray
                .filter(attr => attr.key === PROFILE_KEY)
                .map(attr => attr.value);
        }

        function groupAttributesByKey(recordArray) {
            const grouped = {};
            recordArray.forEach(attr => {
                if (!grouped[attr.key]) {
                    grouped[attr.key] = [];
                }
                grouped[attr.key].push(attr.value);
            });
            return Object.entries(grouped).map(([key, values]) => ({
                k: key,
                v: values.length > 1 ? values : values[0],
                c: values.length
            }));
        }

        function buildCytoscapeElements() {
            const elements = [];
            const allPids = Object.keys(RAW_GRAPH_DATA);

            const stats = window.profileStats;

            // Create nodes
            Object.entries(RAW_GRAPH_DATA).forEach(([pid, recordData]) => {
                const recordArray = recordData.record || [];
                const profilePids = extractProfilePids(recordArray);
                const groupedAttrs = groupAttributesByKey(recordArray);

                const node = {
                    data: {
                        id: pid,
                        label: truncatePid(pid),
                        full_pid: pid,
                        profiles: profilePids,
                        attrs: groupedAttrs,
                        nodeColor: blendColorsWeighted(profilePids, stats)
                    },
                };
                elements.push(node);
            });

            // Create edges: AUTOMATIC RELATIONSHIP DETECTION
            // Rule: If attribute.value == another FDO's PID → relationship exists
            // Special case: namedReference stores target in JSON structure
            Object.entries(RAW_GRAPH_DATA).forEach(([sourcePid, recordData]) => {
                const recordArray = recordData.record || [];

                recordArray.forEach(attr => {
                    let targetValue = attr.value;

                    // Check if this is a namedReference complex attribute
                    if (typeof attr.value === 'string' && attr.value.startsWith('{')) {
                        try {
                            const parsed = JSON.parse(attr.value);
                            if (parsed.relationshipPredicate && parsed.target) {
                                targetValue = parsed.target;
                            }
                        } catch (e) {
                            // Not valid JSON, use original value
                        }
                    }

                    const isRelationship = allPids.includes(targetValue);

                    if (isRelationship) {
                        const edge = {
                            data: {
                                source: sourcePid,
                                target: targetValue,
                                k: attr.key,
                                predicate: typeof attr.value === 'string' && attr.value.startsWith('{')
                                    ? (() => {
                                        try {
                                            return JSON.parse(attr.value).relationshipPredicate;
                                        } catch (e) {
                                            return null;
                                        }
                                    })()
                                    : null
                            }
                        };
                        elements.push(edge);
                    }
                });
            });

            return { elements };
        }

        async function resolveAttributeName(attrKeyPid) {
            if (attrMetaCache.has(attrKeyPid)) {
                return attrMetaCache.get(attrKeyPid);
            }

            try {
                const handleNetUrl = `https://hdl.handle.net/api/handles/${encodeURIComponent(attrKeyPid)}?noredirect=true`;
                const response = await fetch(handleNetUrl);

                if (!response.ok) {
                    console.warn(`Failed to fetch ${attrKeyPid}: ${response.status}`);
                    return { name: truncatePid(attrKeyPid, 25), description: '' };
                }

                const record = await response.json();

                if (!record.values || record.values.length === 0) {
                    return { name: truncatePid(attrKeyPid, 25), description: '' };
                }

                let name = '';
                let description = '';

                const locationEntry = record.values.find(v => v.type === '10320/loc');
                if (locationEntry?.data?.value) {
                    try {
                        const parser = new DOMParser();
                        const xmlDoc = parser.parseFromString(locationEntry.data.value, 'text/xml');
                        const locations = xmlDoc.getElementsByTagName('location');

                        for (let j = 0; j < locations.length; j++) {
                            const href = locations[j].getAttribute('href');
                            const view = locations[j].getAttribute('view');

                            if (view === 'json' && href) {
                                const epicResponse = await fetch(href);
                                if (epicResponse.ok) {
                                    const epicJson = await epicResponse.json();
                                    name = epicJson['name'] || '';
                                    description = epicJson['description'] || '';
                                    console.log(`Resolved ${attrKeyPid}: ${name}`);
                                    break;
                                }
                            }
                        }
                    } catch (e) {
                        console.warn(`Failed to parse location XML for ${attrKeyPid}:`, e);
                    }
                }

                if (!name || !description) {
                    for (const val of record.values) {
                        const typeStr = val.type || '';
                        const dataValue = val.data?.value || '';

                        if (!name && (typeStr.includes('bd3e9fb9b606d2198c9e') ||
                            typeStr.toLowerCase().includes('name') ||
                            typeStr.toLowerCase().includes('title'))) {
                            name = dataValue;
                        }

                        if (!description && (typeStr.includes('880724416f5857987e70') ||
                            typeStr.toLowerCase().includes('description'))) {
                            description = dataValue;
                        }
                    }
                }

                const meta = { name: name || truncatePid(attrKeyPid, 25), description };
                attrMetaCache.set(attrKeyPid, meta);
                return meta;
            } catch (error) {
                console.warn(`Failed to resolve ${attrKeyPid}:`, error);
            }

            return { name: truncatePid(attrKeyPid, 25), description: '' };
        }

        class Semaphore {
            constructor(count) {
                this.count = count;
                this.queue = [];
            }

            acquire() {
                return new Promise(resolve => {
                    if (this.count > 0) {
                        this.count--;
                        resolve();
                    } else {
                        this.queue.push(resolve);
                    }
                });
            }

            release() {
                this.count++;
                if (this.queue.length > 0) {
                    this.count--;
                    this.queue.shift()();
                }
            }
        }

        async function preloadAttributeMetadata(cytoscapeElements) {
            const allAttrKeys = new Set();
            const profilePids = new Set();

            Object.values(RAW_GRAPH_DATA).forEach(recordData => {
                const recordArray = recordData.record || [];

                const profiles = extractProfilePids(recordArray);
                profiles.forEach(p => profilePids.add(p));

                recordArray.forEach(attr => {
                    if (attr.key) {
                        allAttrKeys.add(attr.key);
                    }
                });
            });

            const uniqueAttrKeys = new Set([...allAttrKeys, ...profilePids]);

            const totalToResolve = uniqueAttrKeys.size;
            let resolvedCount = 0;

            if (totalToResolve === 0) {
                hideLoadingOverlay();
                return;
            }

            console.log(`Resolving ${totalToResolve} unique PIDs (${allAttrKeys.size} attributes + ${profilePids.size} profiles)...`);
            updateLoading(3, 0);

            const batchSize = 20;
            const maxConcurrent = 5;
            const keysArray = Array.from(uniqueAttrKeys);

            async function resolveBatchWithConcurrency(batch) {
                const semaphore = new Semaphore(maxConcurrent);

                const promises = batch.map(key =>
                    semaphore.acquire().then(() =>
                        resolveAttributeName(key).finally(() => semaphore.release())
                    )
                );

                await Promise.allSettled(promises);
                resolvedCount += batch.length;
                updateLoading(3, (resolvedCount / totalToResolve) * 100);
            }

            try {
                for (let i = 0; i < keysArray.length; i += batchSize) {
                    const batch = keysArray.slice(i, i + batchSize);
                    await resolveBatchWithConcurrency(batch);
                }
            } finally {
                hideLoadingOverlay();
            }
        }

        /**
         * Build inverted search index from graph nodes.
         * Indexes PIDs, profile names, attribute names/values.
         * Creates both tokenized terms and raw text for matching.
         * @async
         */
        async function buildSearchIndex() {
            searchIndex.nodeIndex.clear();
            searchIndex.invertedIndex.clear();

            console.log('Building search index...');

            cy.nodes().forEach(node => {
                const data = node.data();
                const terms = new Set();

                if (data.full_pid) {
                    tokenize(data.full_pid).forEach(t => terms.add(t));
                }

                const profiles = data.profiles || [];
                const profileNames = [];
                profiles.forEach(pid => {
                    const meta = attrMetaCache.get(pid);
                    if (meta?.name) {
                        tokenize(meta.name).forEach(t => terms.add(t));
                        profileNames.push(meta.name);
                    }
                });

                const attrs = data.attrs || [];
                const attrNames = [];
                const attrValues = [];
                attrs.forEach(attr => {
                    const keyMeta = attrMetaCache.get(attr.k);
                    if (keyMeta?.name) {
                        tokenize(keyMeta.name).forEach(t => terms.add(t));
                        attrNames.push(keyMeta.name);
                    }

                    const values = Array.isArray(attr.v) ? attr.v : [attr.v];
                    values.forEach(v => {
                        if (typeof v === 'string') {
                            tokenize(v).forEach(t => terms.add(t));
                            attrValues.push(v);
                        }
                    });
                });

                const allText = [
                    data.full_pid || '',
                    ...profileNames,
                    ...attrNames,
                    ...attrValues
                ].filter(Boolean);

                searchIndex.nodeIndex.set(node.id(), {
                    pid: data.full_pid,
                    label: data.label,
                    terms: Array.from(terms),
                    rawText: allText.join(' ').toLowerCase(),
                    profiles,
                    node: node
                });

                terms.forEach(term => {
                    if (!searchIndex.invertedIndex.has(term)) {
                        searchIndex.invertedIndex.set(term, new Set());
                    }
                    searchIndex.invertedIndex.get(term).add(node.id());
                });
            });

            console.log(`✓ Search index built: ${searchIndex.nodeIndex.size} nodes, ${searchIndex.invertedIndex.size} unique terms`);
        }

        function getEdgeColor(edge) {
            const key = edge.data('k');
            const meta = attrMetaCache.get(key);
            const name = (meta?.name || '').toLowerCase();

            // Check if this is a namedReference edge (has predicate)
            const predicate = edge.data('predicate');
            if (predicate) {
                // namedReference edges - use purple/indigo to highlight cross-dataset references
                return '#9b59b6';
            }

            if (name.includes('version')) return '#e74c3c';
            if (name.includes('file') || name.includes('data')) return '#27ae60';
            if (name.includes('cite') || name.includes('doi')) return '#2980b9';
            return '#95a5a6';
        }

        function getEdgeLabel(edge) {
            const mode = currentDisplayMode;
            const key = edge.data('k') || '';
            const meta = attrMetaCache.get(key) || { name: truncatePid(key, 20), description: '' };

            // Check if this edge has a namedReference predicate
            const predicate = edge.data('predicate');
            if (predicate) {
                return predicate;
            }

            if (mode === 'pid') {
                return truncate(key, 20);
            } else if (mode === 'name') {
                return truncate(meta.name || key, 20);
            } else {
                return meta.name && meta.name !== truncatePid(key, 25) ? meta.name : truncate(key, 20);
            }
        }

        function truncate(str, len) {
            if (!str) return '';
            if (str.length <= len) return str;

        function calculateNodeDegrees() {
            const degreeMap = new Map();

            Object.entries(RAW_GRAPH_DATA).forEach(([nodeId, recordData]) => {
                const recordArray = recordData.record || [];
                let inDegree = 0;

                Object.values(RAW_GRAPH_DATA).forEach(otherRecord => {
                    const otherArray = otherRecord.record || [];
                    otherArray.forEach(attr => {
                        // Check for namedReference JSON structure
                        let targetValue = attr.value;
                        if (typeof attr.value === 'string' && attr.value.startsWith('{')) {
                            try {
                                const parsed = JSON.parse(attr.value);
                                if (parsed.target) {
                                    targetValue = parsed.target;
                                }
                            } catch (e) {
                                // Not valid JSON, use original value
                            }
                        }

                        if (targetValue === nodeId) {
                            inDegree++;
                        }
                    });
                });

                const allPids = Object.keys(RAW_GRAPH_DATA);
                // Count outgoing edges, handling namedReference JSON structure
                const outDegree = recordArray.filter(attr => {
                    let targetValue = attr.value;
                    if (typeof attr.value === 'string' && attr.value.startsWith('{')) {
                        try {
                            const parsed = JSON.parse(attr.value);
                            if (parsed.target) {
                                targetValue = parsed.target;
                            }
                        } catch (e) {
                            // Not valid JSON, use original value
                        }
                    }
                    return allPids.includes(targetValue);
                }).length;

                degreeMap.set(nodeId, {
                    total: inDegree + outDegree,
                    in: inDegree,
                    out: outDegree
                });
            });

            return degreeMap;
        }

        function identifySuperNodes(degreeMap) {
            const degrees = Array.from(degreeMap.values()).map(d => d.total);

            if (degrees.length === 0) {
                return { superNodes: new Set(), threshold: Infinity, mean: 0, stddev: 0 };
            }

            const mean = degrees.reduce((a, b) => a + b, 0) / degrees.length;
            const variance = degrees.reduce((sum, d) => sum + Math.pow(d - mean, 2), 0) / degrees.length;
            const stddev = Math.sqrt(variance);
            const threshold = mean + 1.5 * stddev;

            const superNodes = new Set();
            degreeMap.forEach((data, nodeId) => {
                if (data.total >= threshold) {
                    superNodes.add(nodeId);
                }
            });

            console.log(`Super-node analysis: ${superNodes.size}/${degrees.length} nodes identified (${(superNodes.size/degrees.length*100).toFixed(1)}%)`);
            console.log(`Threshold: ${threshold.toFixed(2)} connections (mean=${mean.toFixed(2)}, stddev=${stddev.toFixed(2)})`);

            return { superNodes, threshold, mean, stddev };
        }

                                    ? 0
                                    : Math.min(1, (degree - stats.mean) / (stats.threshold - stats.mean));
                                if (!isFinite(scale)) return baseSize;
                                return baseSize + (maxSize - baseSize) * scale;
                            },
                            'border-width': 4,
                            'shadow-blur': '10px',
                            'shadow-color': 'rgba(231, 76, 60, 0.4)',
                            'shadow-offset-x': 0,
                            'shadow-offset-y': 0
                        }
                    }
                ],
                layout: {
                    name: DEFAULT_LAYOUT,
                    animate: true,
                    animationDuration: 500,
                    nodeRepulsion: 10500,
                    idealEdgeLength: 250,
                    edgeElasticity: 100,
                    nestingFactor: 0.3,
                    padding: 15,
                    numIter: 25000,
                    ready: function() {
                        const degreeMap = calculateNodeDegrees();
                        const { superNodes, threshold, mean, stddev } = identifySuperNodes(degreeMap);

                        window.superNodeStats = { threshold, mean, stddev };

                        cy.nodes().forEach(node => {
                            if (superNodes.has(node.id())) {
                                node.addClass('super-node');
                                node.data('degreeInfo', degreeMap.get(node.id()));
                            }
                        });

                        updateSuperNodeStatistics(superNodes.size, threshold);
                    }
                },
                wheelSensitivity: 0.3,
                minZoom: 0.005,
                maxZoom: 10
            });

            updateStatistics();

            cy.on('tap', 'node', function(evt) {
                showNodeDetails(evt.target);
            });

            cy.on('dblclick', 'node', function(evt) {
                const clickedNode = evt.target;

                if (!focusedNodeId) {
                    showToast('Double-click works in focus mode. Click "Focus on This Node" first.', 'info');
                    return;
                }

                if (!focusedNodeSet.has(clickedNode.id())) {
                    showToast('Click on a visible node to expand', 'warning');
                    return;
                }

                expandFocusToNeighbors(clickedNode);
            });

            cy.on('tap', function(evt) {
                if (evt.target === cy) {
                    closeDetailsPanel();
                }
            });
        }

        function getNodeColor(node) {
            return node.data('nodeColor') || '#95a5a6';
        }

        function updateStatistics() {
            const nodes = cy.nodes().length;
            const edges = cy.edges().length;
            document.getElementById('stat-nodes').textContent = nodes;
            document.getElementById('stat-edges').textContent = edges;
        }

        function showNodeDetails(node) {
            const data = node.data();
            const content = document.getElementById('details-content');
            content.innerHTML = '';

            function createPidComponent(value) {
                const component = document.createElement('pid-component');
                component.setAttribute('value', value);
                component.setAttribute('dark-mode', 'light');
                component.setAttribute('level-of-subcomponents', '3');
                component.setAttribute('emphasize-component', 'false');
                component.setAttribute('show-top-level-copy', 'true');
                return component;
            }

            function createProfileLink(profilePid) {
                const link = document.createElement('a');
                link.href = `https://hdl.handle.net/${profilePid}`;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.className = 'profile-badge';
                link.textContent = profilePid;
                return link;
            }

            function createAttributeKeyLink(attrKey, attrName) {
                const link = document.createElement('a');
                link.href = `https://hdl.handle.net/${attrKey}`;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.className = 'attribute-key-link';
                link.textContent = attrName;
                return link;
            }

            function createAttributeValueElement(value) {
                const wrapper = document.createElement('div');

                // Special case: Check if this is a namedReference complex attribute
                if (typeof value === 'string' && value.startsWith('{')) {
                    try {
                        const parsed = JSON.parse(value);
                        if (parsed.relationshipPredicate && parsed.target) {
                            // This is a namedReference - render predicate + target link
                            const container = document.createElement('div');
                            container.style.display = 'flex';
                            container.style.flexDirection = 'column';
                            container.style.gap = '4px';

                            // Predicate badge
                            const predicateBadge = document.createElement('span');
                            predicateBadge.style.background = '#3498db';
                            predicateBadge.style.color = 'white';
                            predicateBadge.style.padding = '2px 8px';
                            predicateBadge.style.borderRadius = '12px';
                            predicateBadge.style.fontSize = '11px';
                            predicateBadge.style.fontWeight = '600';
                            predicateBadge.textContent = parsed.relationshipPredicate;
                            container.appendChild(predicateBadge);

                            // Target PID component
                            const targetLabel = document.createElement('span');
                            targetLabel.style.fontSize = '10px';
                            targetLabel.style.color = '#7f8c8d';
                            targetLabel.textContent = '→ Target:';
                            container.appendChild(targetLabel);

                            const targetPidComp = createPidComponent(parsed.target);
                            container.appendChild(targetPidComp);

                            wrapper.appendChild(container);
                            return wrapper;
                        }
                    } catch (e) {
                        // Not valid JSON, fall through to normal PID handling
                    }
                }

                // Default: treat as regular PID
                wrapper.appendChild(createPidComponent(value));
                return wrapper;
            }

            const pidRow = document.createElement('div');
            pidRow.className = 'detail-row';
            pidRow.innerHTML = `
                <div class="detail-label">PID</div>
                <div class="detail-value pid" data-pid="${escapeHtml(data.full_pid || data.id)}">${escapeHtml(data.full_pid || data.id)}</div>
            `;
            content.appendChild(pidRow);

            const profilesRow = document.createElement('div');
            profilesRow.className = 'detail-row';
            const profilesLabel = document.createElement('div');
            profilesLabel.className = 'detail-label';
            profilesLabel.textContent = 'Profiles';
            profilesRow.appendChild(profilesLabel);

            const profilesValue = document.createElement('div');
            profilesValue.className = 'detail-value';

            if (data.profiles && data.profiles.length > 0) {
                data.profiles.forEach(p => {
                    profilesValue.appendChild(createProfileLink(p));
                    profilesValue.appendChild(document.createTextNode(' '));
                });
            } else {
                const noneSpan = document.createElement('span');
                noneSpan.style.color = '#95a5a6';
                noneSpan.textContent = 'None';
                profilesValue.appendChild(noneSpan);
            }

            profilesRow.appendChild(profilesValue);
            content.appendChild(profilesRow);

            const attrsRow = document.createElement('div');
            attrsRow.className = 'detail-row';
            const attrsLabel = document.createElement('div');
            attrsLabel.className = 'detail-label';
            attrsLabel.textContent = `Attributes (${data.attrs?.length || 0})`;
            attrsRow.appendChild(attrsLabel);

            if (data.attrs && data.attrs.length > 0) {
                const attrList = document.createElement('ul');
                attrList.className = 'attribute-list';

                data.attrs.forEach(attr => {
                    const meta = attrMetaCache.get(attr.k) || { name: attr.k, description: '' };
                    const hasMultiple = attr.c && attr.c > 1;
                    const values = Array.isArray(attr.v) ? attr.v : [attr.v];

                    const attrItem = document.createElement('li');
                    attrItem.className = 'attribute-item';

                    const attrKeyDiv = document.createElement('div');
                    attrKeyDiv.className = 'attribute-key';

                    const keyLink = createAttributeKeyLink(attr.k, meta.name);
                    attrKeyDiv.appendChild(keyLink);

                    const countSpan = document.createElement('span');
                    countSpan.style.color = '#95a5a6';
                    countSpan.style.fontWeight = 'normal';
                    countSpan.textContent = `(${attr.c || 1} ${hasMultiple ? 'values' : 'value'})`;
                    attrKeyDiv.appendChild(countSpan);

                    attrItem.appendChild(attrKeyDiv);

                    if (!hasMultiple) {
                        attrItem.appendChild(createAttributeValueElement(values[0]));
                    } else {
                        const valuesDiv = document.createElement('div');
                        valuesDiv.className = 'attribute-values';
                        const ul = document.createElement('ul');
                        values.forEach(v => {
                            const li = document.createElement('li');
                            li.appendChild(createAttributeValueElement(v));
                            ul.appendChild(li);
                        });
                        valuesDiv.appendChild(ul);
                        attrItem.appendChild(valuesDiv);
                    }

                    const showDescriptions = document.getElementById('show-descriptions')?.checked;
                    if (showDescriptions && meta.description) {
                        const descDiv = document.createElement('div');
                        descDiv.className = 'attribute-description';
                        descDiv.textContent = meta.description;
                        attrItem.appendChild(descDiv);
                    }

                    attrList.appendChild(attrItem);
                });

                attrsRow.appendChild(attrList);
            } else {
                const noAttrsP = document.createElement('p');
                noAttrsP.style.color = '#95a5a6';
                noAttrsP.textContent = 'No attributes';
                attrsRow.appendChild(noAttrsP);
            }

            content.appendChild(attrsRow);

            const buttonRow = document.createElement('div');
            buttonRow.className = 'detail-row';

            const focusBtn = document.createElement('button');
            focusBtn.className = 'btn btn-primary btn-inline';
            focusBtn.id = 'focus-node-btn';
            focusBtn.textContent = 'Focus on This Node';
            buttonRow.appendChild(focusBtn);

            const clearBtn = document.createElement('button');
            clearBtn.className = 'btn btn-secondary btn-inline';
            clearBtn.id = 'clear-focus-btn';
            clearBtn.style.display = 'none';
            clearBtn.textContent = 'Clear Focus';
            buttonRow.appendChild(clearBtn);

            content.appendChild(buttonRow);

            document.getElementById('focus-node-btn')?.addEventListener('click', function() {
                focusOnNode(node);
            });

            if (typeof customElements !== 'undefined') {
                if (customElements.get('pid-component')) {
                    customElements.upgrade(content);
                } else {
                    customElements.whenDefined('pid-component').then(() => {
                        customElements.upgrade(content);
                    });
                }
            }

            document.getElementById('details-panel').classList.add('open');

            setTimeout(() => {
                if (typeof customElements !== 'undefined' && customElements.get('pid-component')) {
                    customElements.upgrade(content);
                }
            }, 100);
        }

        function closeDetailsPanel() {
            document.getElementById('details-panel').classList.remove('open');
        }

        function closeAllPopovers() {
            document.querySelectorAll('.profile-settings-popover.active').forEach(popover => {
                popover.classList.remove('active');
            });
        }

        function togglePopover(groupId, button) {
            const existingPopover = document.querySelector(
                `.profile-settings-popover[data-group-id="${groupId}"]`
            );

            if (existingPopover && existingPopover.classList.contains('active')) {
                closeAllPopovers();
                return;
            }

            closeAllPopovers();

            const customization = profileGroupCustomizations.get(groupId);
            const groupData = profileGroupVisibility.get(groupId);
            const defaultColor = getProfileHSL(groupId);
            const defaultColorHex = hslToHex(defaultColor.h, defaultColor.s, defaultColor.l);

            const popover = createPopover(groupId, {
                customName: customization?.customName || '',
                customColor: customization?.customColor || defaultColorHex
            });

            const rect = button.getBoundingClientRect();
            popover.style.left = `${rect.left + window.scrollX}px`;
            popover.style.top = `${rect.bottom + window.scrollY + 5}px`;

            popover.classList.add('active');
        }

        function createPopover(groupId, initialValues) {
            const existing = document.querySelector(`.profile-settings-popover[data-group-id="${groupId}"]`);
            if (existing) existing.remove();

            const groupData = profileGroupVisibility.get(groupId);
            const currentName = initialValues.customName || groupData?.groupName || '';

            const popover = document.createElement('div');
            popover.className = 'profile-settings-popover';
            popover.dataset.groupId = groupId;

            popover.innerHTML = `
                <div class="popover-content">
                    <div class="form-group">
                        <label>Display Name</label>
                        <input type="text"
                               class="custom-name-input"
                               value="${escapeHtml(currentName)}"
                               placeholder="Enter custom name" />
                    </div>
                    <div class="form-group">
                        <label>Color</label>
                        <div class="color-picker-wrapper">
                            <input type="color"
                                   class="custom-color-input"
                                   value="${initialValues.customColor}" />
                            <span class="color-hex-display">${initialValues.customColor}</span>
                        </div>
                    </div>
                    <div class="popover-actions">
                        <button class="btn-save btn-primary">Save</button>
                        <button class="btn-reset btn-secondary">Reset</button>
                    </div>
                </div>
            `;

            const colorInput = popover.querySelector('.custom-color-input');
            const hexDisplay = popover.querySelector('.color-hex-display');

            colorInput.addEventListener('input', (e) => {
                hexDisplay.textContent = e.target.value;
            });

            popover.querySelector('.btn-save').addEventListener('click', () => {
                const customName = popover.querySelector('.custom-name-input').value.trim();

                saveGroupCustomization(groupId, {
                    customName: customName || undefined,
                    customColor: customColor || undefined
                });

                closeAllPopovers();
                updateGroupDisplay(groupId);
                updateUrlParams();
                showToast('Group customization saved', 'success');
