            popover.querySelector('.btn-reset').addEventListener('click', () => {
                profileGroupCustomizations.delete(groupId);
                closeAllPopovers();
                updateGroupDisplay(groupId);
                updateUrlParams();
                showToast('Group settings reset to defaults', 'info');
            });

            document.body.appendChild(popover);
            return popover;
        }

        function saveGroupCustomization(groupId, customization) {
            if (customization.customName || customization.customColor) {
                profileGroupCustomizations.set(groupId, customization);
            } else {
                profileGroupCustomizations.delete(groupId);
            }
        }

        function updateGroupDisplay(groupId) {
            const groupData = profileGroupVisibility.get(groupId);
            const customization = profileGroupCustomizations.get(groupId);

            const headerElement = document.querySelector(
                `.profile-group-header[data-group-id="${groupId}"]`
            );
            if (headerElement) {
                const nameElement = headerElement.querySelector('.group-name');
                if (nameElement) {
                    nameElement.textContent = customization?.customName || groupData?.groupName || '';
                }
            }

            if (customization?.customColor) {
                groupData.customColor = customization.customColor;
            } else {
                delete groupData.customColor;
            }

            cy.nodes().forEach(node => {
                const profiles = node.data('profiles') || [];
                if (profiles.some(p => groupData.allProfiles.has(p))) {
                    const newColor = blendColorsWeighted(profiles, window.profileStats);
                    node.data('nodeColor', newColor);
                }
            });

            cy.style().update();
        }

        function applyLoadedConfig() {
            initProfileFilters();
            filterByProfile();
            filterByRelationship();
            for (const groupId of profileGroupVisibility.keys()) {
                updateGroupDisplay(groupId);
            }
            if (profileGroupCustomizations.size > 0) {
                showToast(`Loaded ${profileGroupCustomizations.size} customizations`, 'success');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function encodeCustomizationsToUrl() {
            if (profileGroupCustomizations.size === 0) {
                return '';
            }

            const configArray = Array.from(profileGroupCustomizations.entries())
                .map(([pid, data]) => ({
                    pid,
                    n: data.customName || '',
                    c: data.customColor || ''
                }));

            const jsonString = JSON.stringify(configArray);
            return btoa(encodeURIComponent(jsonString));
        }

        function decodeCustomizationsFromUrl(encoded) {
            try {
                const jsonString = decodeURIComponent(atob(encoded));
                const configArray = JSON.parse(jsonString);

                const map = new Map();
                configArray.forEach(item => {
                    map.set(item.pid, {
                        customName: item.n || undefined,
                        customColor: item.c || undefined
                    });
                });

                return map;
            } catch (error) {
                console.error('Failed to decode profile customizations:', error);
                return new Map();
            }
        }

        function updateUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const encoded = encodeCustomizationsToUrl();

            if (encoded) {
                params.set('cfg', encoded);
            } else {
                params.delete('cfg');
            }

            const newUrl = `${window.location.pathname}${params.toString() ? '?' + params.toString() : ''}`;
            history.replaceState({}, '', newUrl);
        }

        function loadCustomizationsFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const encoded = params.get('cfg');

            if (encoded) {
                profileGroupCustomizations = decodeCustomizationsFromUrl(encoded);
                console.log(`Loaded ${profileGroupCustomizations.size} group customizations from URL`);
            }
        }

        function getPrimaryProfile(profiles, stats) {
            if (!profiles || profiles.length === 0) return null;
            if (profiles.length === 1) return profiles[0];

            return profiles.reduce((primary, current) => {
                const currentFreq = stats.frequencyMap.get(current) || Infinity;
                const primaryFreq = stats.frequencyMap.get(primary) || Infinity;
                return currentFreq < primaryFreq ? current : primary;
            });
        }

        function initProfileFilters() {
            const stats = window.profileStats;
            const container = document.getElementById('profile-filters');
            container.innerHTML = '';

            const primaryProfileGroups = new Map();

            Object.entries(RAW_GRAPH_DATA).forEach(([pid, recordData]) => {
                const profiles = extractProfilePids(recordData.record || []);
                if (profiles.length === 0) return;

                const primary = getPrimaryProfile(profiles, stats);
                if (!primaryProfileGroups.has(primary)) {
                    primaryProfileGroups.set(primary, {
                        nodeCount: 0,
                        allProfiles: new Set()
                    });
                }
                const group = primaryProfileGroups.get(primary);
                group.nodeCount++;
                profiles.forEach(p => group.allProfiles.add(p));
            });

            const sortedGroups = Array.from(primaryProfileGroups.entries())
                .sort((a, b) => b[1].nodeCount - a[1].nodeCount);

            profileGroupVisibility.clear();

            sortedGroups.forEach(([primaryPid, group]) => {
                const primaryMeta = attrMetaCache.get(primaryPid);
                const customization = profileGroupCustomizations.get(primaryPid);
                const displayName = customization?.customName || primaryMeta?.name || truncatePid(primaryPid, 25);

                const groupDiv = document.createElement('div');
                groupDiv.className = 'profile-group';
                groupDiv.dataset.groupId = primaryPid;
                groupDiv.innerHTML = `
                    <div class="profile-group-header" data-group-id="${primaryPid}">
                        <span class="collapse-icon">▼</span>
                        <span class="group-name">${escapeHtml(displayName)}</span>
                        <button class="group-settings-btn" title="Customize">⚙️</button>
                        <span class="group-count">(${group.nodeCount})</span>
                    </div>
                    <div class="profile-group-members">
                    </div>
                `;

                const membersContainer = groupDiv.querySelector('.profile-group-members');

                const profilesVisibility = new Map();

                const isPrimary = true;
                const checkboxDiv = document.createElement('div');
                checkboxDiv.className = `filter-checkbox primary-profile`;
                checkboxDiv.innerHTML = `
                    <label>
                        <input type="checkbox" class="profile-filter"
                               data-profile="${escapeHtml(primaryPid)}" checked>
                        <span>${escapeHtml(displayName)} ★ (Primary)</span>
                    </label>
                `;
                membersContainer.appendChild(checkboxDiv);
                profilesVisibility.set(primaryPid, true);

                profileGroupVisibility.set(primaryPid, {
                    primaryPid,
                    groupName: primaryMeta?.name || truncatePid(primaryPid, 25),
                    nodeCount: group.nodeCount,
                    allProfiles: group.allProfiles,
                    profiles: profilesVisibility,
                    customName: customization?.customName,
                    customColor: customization?.customColor
                });

                const header = groupDiv.querySelector('.profile-group-header');
                header.addEventListener('click', (e) => {
                    if (e.target.classList.contains('group-settings-btn')) return;
                    const members = groupDiv.querySelector('.profile-group-members');
                    const icon = header.querySelector('.collapse-icon');
                    if (members.style.display === 'none') {
                        members.style.display = 'block';
                        icon.textContent = '▼';
                    } else {
                        members.style.display = 'none';
                        icon.textContent = '▶';
                    }
                });

                const settingsBtn = header.querySelector('.group-settings-btn');
                settingsBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    togglePopover(primaryPid, e.currentTarget);
                });

                container.appendChild(groupDiv);
            });

            document.querySelectorAll('.profile-filter').forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    const profile = this.dataset.profile;
                    for (const [groupId, groupData] of profileGroupVisibility) {
                        if (groupData.profiles.has(profile)) {
                            groupData.profiles.set(profile, this.checked);
                            break;
                        }
                    }
                    filterByProfile();
                });
            });
        }

        function initRelationshipFilters() {
            const container = document.getElementById('relationship-filters');
            container.innerHTML = '';

            const toggleDiv = document.createElement('div');
            toggleDiv.className = 'control-group';
            toggleDiv.innerHTML = `
                <label>
                    <input type="checkbox" id="show-all-edges" checked>
                    Show all edges
                </label>
            `;
            container.appendChild(toggleDiv);

            document.getElementById('show-all-edges').addEventListener('change', function() {
                if (this.checked) {
                    cy.edges().removeClass('hidden');
                } else {
                    cy.edges().addClass('hidden');
                }
            });

            const relationshipTypes = new Map();

            cy.edges().forEach(edge => {
                const key = edge.data('k');
                const meta = attrMetaCache.get(key) || { name: truncatePid(key) };

                if (!relationshipTypes.has(key)) {
                    relationshipTypes.set(key, {
                        pid: key,
                        name: meta.name,
                        count: 0,
                        failed: !meta.name || meta.name === truncatePid(key)
                    });
                }
                relationshipTypes.get(key).count++;
            });

            const hr = document.createElement('hr');
            hr.style.border = 'none';
            hr.style.borderTop = '1px solid #34495e';
            hr.style.margin = '10px 0';
            container.appendChild(hr);

            relationshipTypes.forEach((rel, pid) => {
                visibleRelationships.add(pid);
                const div = document.createElement('div');
                div.className = 'filter-checkbox';
                div.style.marginBottom = '5px';
                div.innerHTML = `
                    <label>
                        <input type="checkbox" class="relationship-filter"
                               data-pid="${escapeHtml(pid)}" checked>
                        <span>${escapeHtml(rel.name)} (${rel.count})</span>
                    </label>
                `;
                container.appendChild(div);
            });

            document.querySelectorAll('.relationship-filter').forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    const pid = this.dataset.pid;
                    if (this.checked) {
                        visibleRelationships.add(pid);
                    } else {
                        visibleRelationships.delete(pid);
                    }
                    filterByRelationship();
                });
            });
        }

        function filterByRelationship() {
            if (focusedNodeId) return;

            cy.edges().forEach(edge => {
                const relPid = edge.data('k');
                if (visibleRelationships.has(relPid)) {
                    edge.removeClass('hidden-relationship');
                } else {
                    edge.addClass('hidden-relationship');
                }
            });

            cy.nodes().forEach(node => {
                const hasVisibleEdge = node.connectedEdges().some(e => {
                    return !e.hasClass('hidden-relationship') &&
                           !e.hasClass('hidden') &&
                           !e.hasClass('hidden-profile');
                });

                const profiles = node.data('profiles') || [];
                const profilesByGroup = groupProfilesByFamily(profiles);

                let passesProfileFilter = profiles.length === 0;
                if (!passesProfileFilter) {
                    for (const [groupId, groupProfiles] of profilesByGroup) {
                        const groupVisibility = profileGroupVisibility.get(groupId);
                        if (!groupVisibility) continue;

                        const allDeselected = groupProfiles.every(
                            p => !groupVisibility.profiles.get(p)
                        );

                        if (!allDeselected) {
                            passesProfileFilter = true;
                            break;
                        }
                    }
                }

                if (!hasVisibleEdge && passesProfileFilter) {
                    node.addClass('hidden-isolated');
                } else {
                    node.removeClass('hidden-isolated');
                }
            });
        }

        function highlightNewNodes(nodes) {
            nodes.forEach(node => {
                node.addClass('newly-added');
            });

            setTimeout(() => {
                nodes.forEach(node => {
                    node.removeClass('newly-added');
                });
            }, CONFIG.FOCUS.EXPANSION_HIGHLIGHT_DURATION);
        }

        function expandFocusToNeighbors(node) {
            if (originalFocusedNodeSet.size === 0) {
                originalFocusedNodeSet = new Set(focusedNodeSet);
                originalFocusedEdgeSet = new Set(focusedEdgeSet);
            }

            const incomingEdges = node.incomingEdges();
            const outgoingEdges = node.outgoingEdges();
            const allConnectingEdges = incomingEdges.union(outgoingEdges);
            const allNeighbors = allConnectingEdges.connectedNodes();

            let newCount = 0;
            const newlyAdded = [];

            allNeighbors.forEach(n => {
                if (!focusedNodeSet.has(n.id())) {
                    focusedNodeSet.add(n.id());
                    newlyAdded.push(n);
                    newCount++;
                }
            });

            allConnectingEdges.forEach(e => {
                if (!focusedEdgeSet.has(e.id())) {
                    focusedEdgeSet.add(e.id());
                }
            });

            updateFocusVisibility();
            highlightNewNodes(newlyAdded);

            if (newCount > 0) {
                showToast(`Added ${newCount} neighbor${newCount > 1 ? 's' : ''} to focus`, 'success');
            } else {
                showToast('No new neighbors to add', 'info');
            }

            cy.animate({
                fit: {
                    eles: cy.elements().filter(e =>
                        focusedNodeSet.has(e.id()) || focusedEdgeSet.has(e.id())
                    ),
                    padding: CONFIG.SEARCH.HIGHLIGHT_PADDING
                },
                duration: CONFIG.SEARCH.ANIMATION_DURATION
            });
        }

        function updateFocusVisibility() {
            cy.nodes().forEach(n => {
                if (focusedNodeSet.has(n.id())) {
                    n.removeClass('hidden-focus hidden-profile hidden-relationship hidden-isolated');
                } else {
                    n.addClass('hidden-focus');
                }
            });

            cy.edges().forEach(e => {
                if (focusedEdgeSet.has(e.id())) {
                    e.removeClass('hidden-focus hidden-profile hidden-relationship');
                } else {
                    e.addClass('hidden-focus');
                }
            });
        }

        function focusOnNode(node) {
            focusedNodeId = node.id();
            focusedNodeSet = new Set([node.id()]);
            focusedEdgeSet = new Set();
            originalFocusedNodeSet.clear();
            originalFocusedEdgeSet.clear();

            const connectedEdges = node.connectedEdges();
            const connectedNodes = connectedEdges.connectedNodes();

            connectedNodes.forEach(n => focusedNodeSet.add(n.id()));
            connectedEdges.forEach(e => focusedEdgeSet.add(e.id()));

            updateFocusVisibility();
            updateFocusButtons();

            cy.animate({
                fit: {
                    eles: cy.elements().filter(e =>
                        focusedNodeSet.has(e.id()) || focusedEdgeSet.has(e.id())
                    ),
                    padding: CONFIG.SEARCH.HIGHLIGHT_PADDING
                },
                duration: CONFIG.SEARCH.ANIMATION_DURATION
            });
        }

        function updateFocusButtons() {
            const focusBtn = document.getElementById('focus-node-btn');
            const clearBtn = document.getElementById('clear-focus-btn');
            if (focusBtn) focusBtn.style.display = 'none';
            if (clearBtn) clearBtn.style.display = 'inline-block';
        }

        function clearFocus() {
            focusedNodeId = null;
            focusedNodeSet.clear();
            focusedEdgeSet.clear();
            originalFocusedNodeSet.clear();
            originalFocusedEdgeSet.clear();

            cy.nodes().forEach(n => {
                n.removeClass('hidden-focus hidden-profile hidden-relationship hidden-isolated');
            });
            cy.edges().forEach(e => {
                e.removeClass('hidden-focus hidden-profile hidden-relationship');
            });

            const focusBtn = document.getElementById('focus-node-btn');
            const clearBtn = document.getElementById('clear-focus-btn');
            if (focusBtn) focusBtn.style.display = 'inline-block';
            if (clearBtn) clearBtn.style.display = 'none';

            filterByProfile();
            filterByRelationship();
        }

        function groupProfilesByFamily(profilePids) {
            const groups = new Map();

            profilePids.forEach(profilePid => {
                for (const [groupId, groupData] of profileGroupVisibility) {
                    if (groupData.profiles.has(profilePid)) {
                        if (!groups.has(groupId)) {
                            groups.set(groupId, []);
                        }
                        groups.get(groupId).push(profilePid);
                        break;
                    }
                }
            });

            return groups;
        }

        function filterByProfile() {
            if (focusedNodeId) return;

            cy.nodes().forEach(node => {
                const nodeProfiles = node.data('profiles') || [];

                if (nodeProfiles.length === 0) {
                    node.addClass('hidden-profile');
                    return;
                }

                const profilesByGroup = groupProfilesByFamily(nodeProfiles);

                let shouldHide = false;

                for (const [groupId, groupProfiles] of profilesByGroup) {
                    const groupVisibility = profileGroupVisibility.get(groupId);
                    if (!groupVisibility) continue;

                    const allDeselected = groupProfiles.every(
                        p => !groupVisibility.profiles.get(p)
                    );

                    if (allDeselected && groupProfiles.length > 0) {
                        shouldHide = true;
                        break;
                    }
                }

                if (shouldHide) {
                    node.addClass('hidden-profile');
                } else {
                    node.removeClass('hidden-profile');
                }
            });

            cy.edges().forEach(edge => {
                const sourceVisible = !edge.source().hasClass('hidden-profile');
                const targetVisible = !edge.target().hasClass('hidden-profile');
                if (sourceVisible && targetVisible) {
                    edge.removeClass('hidden-profile');
                } else {
                    edge.addClass('hidden-profile');
                }
            });
        }

        function hasActiveFilters() {
            for (const groupData of profileGroupVisibility.values()) {
                for (const isVisible of groupData.profiles.values()) {
                    if (!isVisible) return true;
                }
            }
            return false;
        }

        function enterSearchMode() {
            searchMode = true;

            preSearchState = {
                focusedNodeId: focusedNodeId,
                focusedNodeSet: new Set(focusedNodeSet),
                focusedEdgeSet: new Set(focusedEdgeSet),
                filtersActive: hasActiveFilters()
            };

            cy.elements().removeClass('hidden-focus hidden-profile hidden-relationship hidden-isolated');

            document.getElementById('search-input').classList.add('search-mode-active');
            showToast('Search mode: All filters temporarily disabled', 'info');
        }

        function exitSearchMode() {
            if (!searchMode) return;

            searchMode = false;
            cy.elements().removeClass('highlighted');

            if (preSearchState?.focusedNodeId) {
                focusedNodeId = preSearchState.focusedNodeId;
                focusedNodeSet = preSearchState.focusedNodeSet;
                focusedEdgeSet = preSearchState.focusedEdgeSet;
                updateFocusVisibility();
            } else {
                filterByProfile();
                filterByRelationship();
            }

            document.getElementById('search-input').classList.remove('search-mode-active');
            preSearchState = null;
        }

        let searchTimeout;
        document.getElementById('search-input').addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                performSearch(this.value);
            }, 300);
        });

        /**
         * Execute search query against indexed node content.
         * Two-phase matching: exact substrings (boosted) + token matches
         * @param {string} query - Search query string
         */
        function performSearch(query) {
            if (!query.trim()) {
                exitSearchMode();
                return;
            }

            if (!searchMode) {
                enterSearchMode();
            }

            const lowerQuery = query.toLowerCase().trim();
            const results = new Map();

            // Phase 1: Exact substring matches (BOOSTED with score 10)
            cy.nodes().forEach(node => {
                const info = searchIndex.nodeIndex.get(node.id());
                if (info && info.rawText.includes(lowerQuery)) {
                    results.set(node.id(), 10);
                }
            });

            // Phase 2: Token-based matching
            const tokens = tokenize(query);
            tokens.forEach(token => {
                for (const [term, nodeIds] of searchIndex.invertedIndex.entries()) {
                    if (term.includes(token) || token.includes(term)) {
                        nodeIds.forEach(id => {
                            results.set(id, (results.get(id) || 0) + 1);
                        });
                    }
                }
            });

            // Render results with highlighting
            cy.elements().removeClass('highlighted');

            if (results.size === 0) {
                showToast('No matches found', 'warning');
                return;
            }

            const matchedNodes = cy.nodes().filter(n => results.has(n.id()));
            matchedNodes.addClass('highlighted');

            // Analyze match types
            let byExact = 0, byToken = 0;
            results.forEach((score, nodeId) => {
                if (score >= 10) byExact++;
                else byToken++;
            });

            showToast(
                `Found ${results.size} nodes (${byExact} exact, ${byToken} partial)`,
                'success'
            );

            // Focus AND highlight
            cy.animate({
                fit: { eles: matchedNodes, padding: CONFIG.SEARCH.HIGHLIGHT_PADDING },
                duration: CONFIG.SEARCH.ANIMATION_DURATION
            });
        }

        document.getElementById('layout-select').addEventListener('change', function() {
            const layout = this.value;
            console.log('Layout changed to:', layout);

            cy.layout({
                name: layout,
                animate: true,
                animationDuration: 500
            }).run();
        });

        document.querySelectorAll('[data-display]').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('[data-display]').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentDisplayMode = this.dataset.display;
                cy.style().update();
            });
        });

        document.getElementById('show-descriptions').addEventListener('change', function() {
            const node = cy.$(':selected').first();
            if (node.length > 0) {
                showNodeDetails(node);
            }
        });

        document.getElementById('export-svg').addEventListener('click', function() {
            try {
                const svgString = cy.svg();
                if (!svgString || typeof svgString !== 'string') {
                    throw new Error('Failed to generate SVG. The graph may be too large or complex.');
                }

                const blob = new Blob([svgString], { type: 'image/svg+xml' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = 'fdo_graph.svg';
                link.href = url;
                link.click();
                URL.revokeObjectURL(url);
            } catch (error) {
                console.error('SVG export failed:', error);
                alert(`SVG export failed: ${error.message}\n\nPlease try the PNG export option instead.`);
            }
        });

        document.getElementById('export-png').addEventListener('click', function() {
            const pngBase64 = cy.png({ full: true, bg: '#ffffff' });
            const link = document.createElement('a');
            link.download = 'fdo_graph.png';
            link.href = pngBase64;
            link.click();
        });

        document.getElementById('close-details').addEventListener('click', closeDetailsPanel);

        document.addEventListener('click', function(e) {
            if (e.target && e.target.id === 'clear-focus-btn') {
                clearFocus();
            }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.profile-settings-popover') &&
                !e.target.closest('.group-settings-btn')) {
                closeAllPopovers();
            }
        });

        const detailsPanel = document.getElementById('details-panel');

        detailsPanel.addEventListener('transitionend', function(e) {
            if (e.propertyName === 'right' && detailsPanel.classList.contains('open')) {
                const content = document.getElementById('details-content');
                if (content && typeof customElements !== 'undefined') {
                    if (customElements.get('pid-component')) {
                        customElements.upgrade(content);
                    } else {
                        customElements.whenDefined('pid-component').then(() => {
                            customElements.upgrade(content);
                        });
                    }
                }
            }
        });

        async function initializeGraph() {
            console.log('Building Cytoscape elements from raw JSON...');
            updateLoading(0, 100);

            setTimeout(async () => {
                updateLoading(1, 0);

                // Normalize the embedded data into the canonical graph shape so
                // both the merged graph and the flat ES-document list render.
                RAW_GRAPH_DATA = normalizeGraphData(RAW_GRAPH_DATA);

                // Load customizations FIRST so they're available for color calculation
                loadCustomizationsFromUrl();

                console.log('Analyzing profile distribution...');
                window.profileStats = calculateProfileFrequencies();
                console.log(`Found ${window.profileStats.frequencyMap.size} unique profiles across ${window.profileStats.totalNodes} nodes`);
                console.log('Profile frequency stats:', {
                    mean: window.profileStats.mean.toFixed(2),
                    median: window.profileStats.median,
                    stddev: window.profileStats.stddev.toFixed(2)
                });

                updateLoading(1, 50);

                const elements = buildCytoscapeElements();
                updateLoading(1, 100);

                setTimeout(async () => {
                    updateLoading(2, 0);
                    console.log('Collecting all attribute keys...');

                    await preloadAttributeMetadata(elements);

                    updateLoading(3, 100);
                    console.log('Initializing Cytoscape...');
                    initCytoscapeWithElements(elements);

                    await buildSearchIndex();

                    updateLoading(4, 0);
                    console.log('Initializing hierarchical profile filters...');
                    initProfileFilters();
                    initRelationshipFilters();

                    if (profileGroupCustomizations.size > 0) {
                        setTimeout(applyLoadedConfig, 200);
                    }

                    updateLoading(4, 100);
                }, 100);
            }, 100);
        }

        // Initialize graph when DOM is ready
        document.addEventListener('DOMContentLoaded', async () => {
            await initializeGraph();
        });
        customElements.upgrade(document.querySelector('pid-component'));
    </script>
</body>
</html>
